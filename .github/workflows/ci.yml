name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 语法检查
        run: npm run check

      - name: 单元测试 + 端到端测试
        run: npm test

      - name: 冒烟启动（检查服务能起来）
        run: |
          node server.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8787/healthz > /dev/null; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8787/healthz
          curl -fsS http://127.0.0.1:8787/ | head -n 5
          kill $SERVER_PID
