# 短信邮差 Nginx 反向代理
# 用法：
#   sudo cp deploy/nginx-smsmail.conf /etc/nginx/conf.d/smsmail.conf
#   把 sms.example.com 改成你的域名
#   sudo nginx -t && sudo systemctl reload nginx
#   然后 sudo certbot --nginx -d sms.example.com 自动配 HTTPS
#
# 配好之后把 config.json 里的 host 改成 127.0.0.1（只允许本机代理访问）

server {
    listen 80;
    listen [::]:80;
    server_name sms.example.com;

    # certbot 会自动加 443 段，这里保留 80 做跳转

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 实时刷新用的 SSE，必须关掉缓冲、放大超时
    location /api/events {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }
}
